name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - id: release
        name: Derive release version from tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Release tag does not exist: $TAG"
            exit 1
          fi
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release is new or an unpublished retry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "A published GitHub Release already exists for $RELEASE_TAG. Refusing to mutate it."
              exit 1
            fi
            echo "Reusing existing draft release for $RELEASE_TAG."
          else
            echo "No existing release found for $RELEASE_TAG."
          fi

          LATEST_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            LATEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$RELEASE_VERSION"
            IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$LATEST_VERSION"
            if (( 10#$NEW_MAJOR < 10#$OLD_MAJOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR < 10#$OLD_MINOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR == 10#$OLD_MINOR && 10#$NEW_PATCH <= 10#$OLD_PATCH )); then
              echo "Release version $RELEASE_VERSION must be newer than latest published version $LATEST_VERSION."
              exit 1
            fi
          fi

  build:
    name: Build + verify (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: windows
            script: dist:win
          - os: ubuntu-latest
            label: Linux
            platform: linux
            script: dist:linux
          - os: macos-latest
            label: macOS
            platform: macos
            script: dist:mac

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare package version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Run release quality gate
        run: npm run test:ci

      - name: Validate required Windows signing secrets
        if: matrix.platform == 'windows'
        run: node scripts/validate-release-signing.js windows
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Validate required macOS signing and notarization secrets
        if: matrix.platform == 'macos'
        run: node scripts/validate-release-signing.js macos
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build release assets
        run: npm run ${{ matrix.script }}
        env:
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Validate release artifacts
        run: node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" "${{ matrix.platform }}"

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $targets = @(
            "release/Open-Git-Control-${{ needs.prepare.outputs.version }}-win-x64.exe",
            "release/win-unpacked/Open-Git-Control.exe"
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Signed Windows executable was not created: $target" }
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') { throw "Windows signature is not valid for ${target}: $($signature.Status)" }
          }

      - name: Verify signed and notarized macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ZIP_FILE="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p signed-app-check
          ditto -x -k "$ZIP_FILE" signed-app-check
          APP_PATH="$(find signed-app-check -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and prepare legal notices
        run: |
          npm ci
          npm run legal:prepare

      - name: Download verified artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate complete cross-platform release
        run: |
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" windows
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" linux
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" macos

      - name: Generate SHA-256 checksums
        run: node scripts/generate-release-checksums.js release

      - name: Create draft GitHub Release and upload verified assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Open-Git-Control ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          draft: true
          files: |
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify draft assets before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          test "$IS_DRAFT" = "true"

          EXPECTED_ASSETS=(
            "latest.yml"
            "latest-linux.yml"
            "latest-mac.yml"
            "Open-Git-Control-${RELEASE_VERSION}-win-x64.exe"
            "Open-Git-Control-${RELEASE_VERSION}-win-x64.exe.blockmap"
            "Open-Git-Control-${RELEASE_VERSION}-linux-x86_64.AppImage"
            "Open-Git-Control-${RELEASE_VERSION}-linux-amd64.deb"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.dmg"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.zip"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.zip.blockmap"
            "SHA256SUMS.txt"
          )
          UPLOADED_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -Fqx "$asset" <<<"$UPLOADED_ASSETS"; then
              echo "Draft release is missing required asset: $asset"
              exit 1
            fi
          done

      - name: Publish verified draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  sync-readme-release-links:
    name: Sync README release links
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Sync package manifests to release version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Update README download links
        run: npm run docs:release-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json README.md README.de.md; then
            echo "Release version and README links are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md README.de.md
          git commit -m "chore(release): sync ${{ needs.prepare.outputs.tag }} version and download links"
          git push
