name: Feature request / Idee vorschlagen
description: Share an idea or tell us what could be easier.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 'Describe your idea in your own words. All other details are optional. / Beschreibe deine Idee in eigenen Worten. Alle weiteren Angaben sind freiwillig.'
  - type: textarea
    id: problem
    attributes:
      label: Your idea / Deine Idee
      placeholder: What would you like to see, or what could be easier? / Was wünschst du dir oder was könnte einfacher sein?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow (optional) / Gewünschter Ablauf (optional)
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional) / Lösungsvorschlag (optional)
  - type: textarea
    id: value
    attributes:
      label: User value (optional) / Nutzen (optional)
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area (optional) / Betroffener Bereich (optional)
      options:
        - Repository workspace
        - Commit graph
        - Staging and commits
        - Diff viewer
        - Conflict resolver
        - GitHub workflows
        - Release creator
        - Project planning API/MCP
        - Secret scanning or security settings
        - AI-assisted features
        - Settings
        - Packaging, install, or auto-update
        - Documentation
        - Other / Andere
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional) / Umgebung (optional)
      description: Automatically filled by the app. / Wird von der App automatisch ergänzt.
