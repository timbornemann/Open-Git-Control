name: Question / Frage
description: Ask about setup, usage, or the app's behavior.
title: '[Question]: '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: 'Ask your question in your own words. All other details are optional. / Stelle deine Frage in eigenen Worten. Alle weiteren Angaben sind freiwillig.'
  - type: textarea
    id: question
    attributes:
      label: Your question / Deine Frage
      placeholder: What would you like to know? / Was möchtest du wissen?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional) / Kontext (optional)
  - type: textarea
    id: tried
    attributes:
      label: Already tried (optional) / Bereits versucht (optional)
  - type: dropdown
    id: area
    attributes:
      label: Area (optional) / Bereich (optional)
      options:
        - Installation or updates
        - Git workflow
        - GitHub authentication or pull requests
        - Releases
        - Project planning API/MCP
        - AI-assisted features
        - Security or secret scanning
        - Development from source
        - Documentation
        - Other / Andere
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional) / Umgebung (optional)
      description: Automatically filled by the app. / Wird von der App automatisch ergänzt.
  - type: input
    id: app-version
    attributes:
      label: App version (optional) / App-Version (optional)
