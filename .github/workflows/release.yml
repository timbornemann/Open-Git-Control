name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets should be rebuilt (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - id: release
        name: Derive release version from tag
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Release tag does not exist: $TAG"
            exit 1
          fi
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate published release and version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "No GitHub Release exists for $RELEASE_TAG. Create the release before running this workflow."
            exit 1
          fi
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "The release must be published before its assets can be built."
            exit 1
          fi
          echo "Reusing existing release for $RELEASE_TAG."

          LATEST_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$LATEST_TAG" == "$RELEASE_TAG" ]]; then
            echo "The requested tag is already the latest published release. Reusing it."
          elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            LATEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$RELEASE_VERSION"
            IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$LATEST_VERSION"
            if (( 10#$NEW_MAJOR < 10#$OLD_MAJOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR < 10#$OLD_MINOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR == 10#$OLD_MINOR && 10#$NEW_PATCH <= 10#$OLD_PATCH )); then
              echo "Release version $RELEASE_VERSION must be newer than latest published version $LATEST_VERSION."
              exit 1
            fi
          fi

  build:
    name: Build + verify (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: windows
            script: dist:win
          - os: ubuntu-latest
            label: Linux
            platform: linux
            script: dist:linux
          - os: macos-latest
            label: macOS
            platform: macos
            script: dist:mac

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare package version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Run release quality gate
        run: npm run test:ci

      - name: Build release assets
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate release artifacts
        run: node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" "${{ matrix.platform }}"

      - name: Verify macOS application bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ZIP_FILE="$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p signed-app-check
          ditto -x -k "$ZIP_FILE" signed-app-check
          APP_PATH="$(find signed-app-check -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -d "$APP_PATH/Contents/MacOS"
          test -n "$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Attach verified release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and prepare legal notices
        run: |
          npm ci
          npm run legal:prepare

      - name: Download verified artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate complete cross-platform release
        run: |
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" windows
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" linux
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" macos

      - name: Generate SHA-256 checksums
        run: node scripts/generate-release-checksums.js release

      - name: Upload verified assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          files: |
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify uploaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          EXPECTED_ASSETS=(
            "latest.yml"
            "latest-linux.yml"
            "latest-mac.yml"
            "Open-Git-Control-${RELEASE_VERSION}-win-x64.exe"
            "Open-Git-Control-${RELEASE_VERSION}-win-x64.exe.blockmap"
            "Open-Git-Control-${RELEASE_VERSION}-linux-x86_64.AppImage"
            "Open-Git-Control-${RELEASE_VERSION}-linux-amd64.deb"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.dmg"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.zip"
            "Open-Git-Control-${RELEASE_VERSION}-mac-x64.zip.blockmap"
            "SHA256SUMS.txt"
          )
          UPLOADED_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -Fqx "$asset" <<<"$UPLOADED_ASSETS"; then
              echo "Release is missing required asset: $asset"
              exit 1
            fi
          done

  sync-readme-release-links:
    name: Sync README release links
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync package manifests to release version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Update README download links
        run: npm run docs:release-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json README.md README.de.md; then
            echo "Release version and README links are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md README.de.md
          git commit -m "chore(release): sync ${{ needs.prepare.outputs.tag }} version and download links"
          git push
