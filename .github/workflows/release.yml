name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets should be rebuilt (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - id: release
        name: Derive release version from tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Release tag does not exist: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate published release and version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "No GitHub Release exists for $RELEASE_TAG. Create the release before running this workflow."
            exit 1
          fi
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "The release must be published before its assets can be built."
            exit 1
          fi
          echo "Reusing existing release for $RELEASE_TAG."

          LATEST_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$LATEST_TAG" == "$RELEASE_TAG" ]]; then
            echo "The requested tag is already the latest published release. Reusing it."
          elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            LATEST_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$RELEASE_VERSION"
            IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$LATEST_VERSION"
            if (( 10#$NEW_MAJOR < 10#$OLD_MAJOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR < 10#$OLD_MINOR )) ||
               (( 10#$NEW_MAJOR == 10#$OLD_MAJOR && 10#$NEW_MINOR == 10#$OLD_MINOR && 10#$NEW_PATCH <= 10#$OLD_PATCH )); then
              echo "Release version $RELEASE_VERSION must be newer than latest published version $LATEST_VERSION."
              exit 1
            fi
          fi

  verify:
    name: Build + verify (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: windows
          - os: ubuntu-22.04
            label: Linux
            platform: linux
          - os: macos-15-intel
            label: macOS
            platform: macos

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare package version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Prepare Electron runtime
        run: npx --no-install install-electron

      - name: Verify Git LFS test dependency
        run: git lfs version

      - name: Run release quality gate
        run: npm run test:ci

      - name: Upload verified application build
        uses: actions/upload-artifact@v6
        with:
          name: compiled-${{ matrix.platform }}
          path: |
            dist/
            dist-electron/
          if-no-files-found: error

  recovery:
    name: Native recovery (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel
            platform: macos
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare package version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: recovery
          shared-key: recovery-x64
          cache-on-failure: true

      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        # Winit also loads the X11 keyboard runtime when using software rendering.
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev xvfb

      - name: Verify native recovery core
        run: npm run recovery:check && npm run recovery:test

      - name: Build independent recovery helper
        run: npm run recovery:build

      - name: Verify independent recovery UI
        if: runner.os != 'Linux'
        run: npm run recovery:smoke

      - name: Verify independent recovery UI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run recovery:smoke

      - name: Verify actual recovery installation cycles
        run: node scripts/test-recovery-installation.js
        env:
          OGC_RECOVERY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload verified recovery helper
        uses: actions/upload-artifact@v6
        with:
          name: native-recovery-${{ matrix.platform }}
          path: build/recovery/
          if-no-files-found: error

  build:
    name: Package verified builds (${{ matrix.platform }})
    needs: [prepare, verify, recovery]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder: --win nsis
          - os: ubuntu-22.04
            platform: linux
            builder: --linux AppImage deb
          - os: macos-15-intel
            platform: macos
            builder: --mac dmg zip
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare package version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Prepare Electron runtime
        run: npx --no-install install-electron

      - name: Download verified application build
        uses: actions/download-artifact@v6
        with:
          name: compiled-${{ matrix.platform }}

      - name: Download verified recovery helper
        uses: actions/download-artifact@v6
        with:
          name: native-recovery-${{ matrix.platform }}
          path: build/recovery

      - name: Restore native executable permissions after artifact download
        if: runner.os != 'Windows'
        run: chmod 755 build/recovery/open-git-control-recovery

      - name: Prepare distribution license files
        run: npm run legal:prepare

      # test:ci already built the app, and the parallel native job built and
      # tested recovery. Package those exact outputs without compiling again.
      - name: Build release assets
        run: npx --no-install electron-builder ${{ matrix.builder }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate release artifacts
        run: node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" "${{ matrix.platform }}"

      - name: Verify packaged Windows startup and restart
        if: matrix.platform == 'windows'
        run: npm run test:startup:electron -- release/win-unpacked/resources/app.asar

      - name: Verify macOS application bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ZIP_FILE="$(find release -maxdepth 1 -name 'Open-Git-Control-*-mac-x64.zip' ! -name '*Recovery*' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p signed-app-check
          ditto -x -k "$ZIP_FILE" signed-app-check
          APP_PATH="$(find signed-app-check -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -d "$APP_PATH/Contents/MacOS"
          test -n "$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Attach verified release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and prepare legal notices
        run: |
          npm ci
          npm run legal:prepare

      - name: Download verified artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Prepare package version for validation
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Generate SHA-256 checksums
        run: node scripts/generate-release-checksums.js release

      - name: Validate complete cross-platform release
        run: |
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" windows
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" linux
          node scripts/validate-release-assets.js "${{ needs.prepare.outputs.version }}" macos

      - name: Upload verified assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          files: |
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-published-release.js "${{ needs.prepare.outputs.version }}"

  sync-readme-release-links:
    name: Sync README release links
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync package manifests to release version
        run: node scripts/prepare-release-version.js "${{ needs.prepare.outputs.version }}"

      - name: Update README download links
        run: npm run docs:release-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json recovery/Cargo.toml recovery/Cargo.lock README.md README.de.md; then
            echo "Release version and README links are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json recovery/Cargo.toml recovery/Cargo.lock README.md README.de.md
          git commit -m "chore(release): sync ${{ needs.prepare.outputs.tag }} version and download links"
          git push
