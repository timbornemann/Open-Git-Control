name: Bug report / Fehler melden
description: Tell us what went wrong. One description is enough.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'One description is enough. All other details are optional. / Eine Beschreibung genügt. Alle weiteren Angaben sind freiwillig.'
  - type: textarea
    id: actual
    attributes:
      label: What happened? / Was ist passiert?
      placeholder: Describe the bug and, if possible, what you expected. / Beschreibe den Fehler und, wenn möglich, was du erwartet hast.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional) / Schritte zum Reproduzieren (optional)
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior (optional) / Erwartetes Verhalten (optional)
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area (optional) / Betroffener Bereich (optional)
      options:
        - Repository workspace
        - Commit graph
        - Staging and commits
        - Diff viewer
        - Conflict resolver
        - GitHub authentication
        - Pull requests and CI status
        - Release creator
        - Project planning API/MCP
        - Secret scanning or security settings
        - AI-assisted features
        - Settings
        - Packaging, install, or auto-update
        - Documentation
        - Other / Andere
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional) / Umgebung (optional)
      description: Automatically filled by the app. / Wird von der App automatisch ergänzt.
  - type: input
    id: app-version
    attributes:
      label: App version (optional) / App-Version (optional)
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional) / Diagnoseinformationen (optional)
      description: Remove secrets and private information before posting. / Entferne vor dem Senden Secrets und private Angaben.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
